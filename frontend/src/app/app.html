<main class="card">
  <h1>{{ title }}</h1>
  <p class="subtitle">
    Esta aplicación Angular ha sido desplegada automáticamente con <strong>ReleEasy Cloud</strong>.
  </p>

  <section class="counter" aria-labelledby="counter-title">
    <h2 id="counter-title">Prueba de JavaScript</h2>
    <p class="count" aria-live="polite">Has pulsado el botón <span>{{ count() }}</span> veces</p>
    <button type="button" (click)="increment()">Incrementar contador</button>
  </section>
</main>
